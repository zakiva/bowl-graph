<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>HW5 - Bowling Alley</title>
    <style>
      body { 
        margin: 0; 
        overflow: hidden;
        font-family: 'Arial', sans-serif;
        user-select: none;
      }

      /* Scorecard Container UI Overlay */
      #scorecard-container {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(20, 24, 42, 0.85);
        border: 2px solid #3498db;
        border-radius: 8px;
        padding: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        color: white;
        z-index: 10;
        max-width: 95vw;
        overflow-x: auto;
      }

      .scorecard-table {
        border-collapse: collapse;
        text-align: center;
        width: 100%;
        min-width: 650px;
      }

      .scorecard-table th, .scorecard-table td {
        border: 1px solid #4f5d73;
        padding: 4px;
      }

      .scorecard-table th {
        background: #2c3e50;
        font-size: 14px;
        font-weight: bold;
        color: #3498db;
      }

      .frame-box {
        width: 60px;
      }

      .rolls-row td {
        height: 20px;
        width: 30px;
        font-size: 12px;
        background: rgba(255, 255, 255, 0.05);
      }

      .total-score-row td {
        height: 30px;
        font-size: 18px;
        font-weight: bold;
        background: rgba(52, 152, 219, 0.1);
      }

      /* Sidebar Controls Info Overlay */
      #controls-container {
        position: absolute;
        bottom: 20px;
        left: 20px;
        background: rgba(20, 24, 42, 0.85);
        border-left: 4px solid #e74c3c;
        border-radius: 4px;
        padding: 15px;
        color: white;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        z-index: 10;
        pointer-events: none; /* Allows interacting with canvas through background */
      }

      #controls-container h3 {
        margin: 0 0 8px 0;
        color: #e74c3c;
        font-size: 16px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      #controls-container p {
        margin: 4px 0;
        font-size: 14px;
        color: #bdc3c7;
      }

      .key-badge {
        background: #34495e;
        border: 1px solid #7f8c8d;
        border-radius: 3px;
        padding: 1px 6px;
        font-family: monospace;
        color: #fff;
        font-weight: bold;
      }
    </style>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'></script>
  </head>
  <body>
    <div id="scorecard-container">
      <table class="scorecard-table">
        <thead>
          <tr>
            <th colspan="2">Frame 1</th>
            <th colspan="2">Frame 2</th>
            <th colspan="2">Frame 3</th>
            <th colspan="2">Frame 4</th>
            <th colspan="2">Frame 5</th>
            <th colspan="2">Frame 6</th>
            <th colspan="2">Frame 7</th>
            <th colspan="2">Frame 8</th>
            <th colspan="2">Frame 9</th>
            <th colspan="3">Frame 10</th>
            <th style="width: 70px;">Total</th>
          </tr>
        </thead>
        <tbody>
          <tr class="rolls-row">
            <td></td><td></td> <td></td><td></td> <td></td><td></td> <td></td><td></td> <td></td><td></td> <td></td><td></td> <td></td><td></td> <td></td><td></td> <td></td><td></td> <td></td><td></td><td></td> <td rowspan="2" style="font-size: 20px; font-weight: bold; color: #2ecc71; background: rgba(46, 204, 113, 0.1);">0</td>
          </tr>
          <tr class="total-score-row">
            <td colspan="2">-</td>
            <td colspan="2">-</td>
            <td colspan="2">-</td>
            <td colspan="2">-</td>
            <td colspan="2">-</td>
            <td colspan="2">-</td>
            <td colspan="2">-</td>
            <td colspan="2">-</td>
            <td colspan="2">-</td>
            <td colspan="3">-</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div id="controls-container">
      <h3>Alley Infrastructure Controls</h3>
      <p><span class="key-badge">O</span> Toggle Orbit Camera Controls</p>
      <p><span class="key-badge">Mouse Click + Drag</span> Rotate Scene</p>
      <p><span class="key-badge">Scroll Wheel</span> Zoom In/Out</p>
    </div>

    <script src="src/hw5.js" type="module"></script>
  </body>
</html>
